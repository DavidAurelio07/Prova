<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos</title>
    <link rel ="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="topo">
        <h1>Perfil dos candidatos - Eleições 2026 - MG</h1>
    </header>

    <main class="container">

    <!-- Formulário de filtro: GET simples, sem JavaScript. -->
    <form method="get" th:action="@{/}">

        
            <label>
                <input type="radio" name="genero" value="" th:checked="${generoSelecionado == ''}">
                Todos
            </label>
            <label th:each="g : ${generos}">
                <input type="radio" name="genero" th:value="${g}" th:checked="${g == generoSelecionado}">
                <span th:text="${g}">Gênero</span>
            </label>

            <select name="escolaridade">
                <option value="" th:select="${escolaridadeSelecionado = ''}">Todas</option>
                <option th:each="e : ${escolaridade}"
                th:value="${e}"
                th:text="${e}"
                th:selected="${e == escolaridadeSelecionado}"></option>
            </select>

            <input type="number" name="idadeMin" th:value="${idadeMin}">
            <input type="number" name="idadeMax" th:value="${idadeMax}">

        

        <article class="card-candidato" th:each="cand : ${candidatos}">
            <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}" th:alt="${cand.nomeUrna}" class="foto-candidato"/>
            <p th:text="${cand.cargo + ' · ' + cand.siglaPartido}">Cargo · Partido</p> 
        </article>

            

        


    

        <div class="campo botoes">
            <button type="submit">Filtrar</button>
            <a th:href="@{/}" class="limpar">Limpar</a>
        </div>
    </form>

    


    


</body>
</html>
